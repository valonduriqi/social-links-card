<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Inter:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Social links profile</title>
  </head>

  <body>
    <div class="card">
      <img
        src="assets/images/avatar-jessica.jpeg"
        alt="Jesicca Avatar Picture"
        class="avatar"
      />
      <div class="card__header">
        <h1 class="name">Jessica Randall</h1>
        <p class="adress">London, United Kingdom</p>
      </div>
      <p class="card__description">"Front-end developer and avid reader."</p>
      <ul class="links">
        <li class="links__item">GitHub</li>
        <li class="links__item">Frontend Mentor</li>
        <li class="links__item">LinkedIn</li>
        <li class="links__item">Twitter</li>
        <li class="links__item">Instagram</li>
      </ul>
    </div>
  </body>
</html>
